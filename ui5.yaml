specVersion: "4.0"
metadata:
  name: btpoc
type: application
framework:
  name: SAPUI5
  version: "1.148.1"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon
builder:
  resources:
    excludes:
      - "test/e2e/**"
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
    - name: ui5-middleware-livereload
      afterMiddleware: compression
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      configuration:
        mountPath: /sfsf
        # TODO: Replace with your SuccessFactors API hostname (e.g. https://api10.successfactors.com)
        baseUri: https://YOUR_SF_HOST
